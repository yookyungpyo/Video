<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      @font-face { font-family: "BlackHanSans"; font-weight: 400; src: url("assets/fonts/black-han-sans-korean-400-normal.woff2") format("woff2"); }
      @font-face { font-family: "NotoSansKR"; font-weight: 700; src: url("assets/fonts/noto-sans-kr-korean-700-normal.woff2") format("woff2"); }
      @font-face { font-family: "NotoSansKR"; font-weight: 900; src: url("assets/fonts/noto-sans-kr-korean-900-normal.woff2") format("woff2"); }
      :root {
        --paper: #f4f1ea;
        --card: #ffffff;
        --ink: #1a1a1a;
        --dim: #6f6a61;
        --line: #d9d3c7;
        --red: #ff4d3a;
        --redText: #d93a28;
        --display: "Inter", "BlackHanSans", sans-serif;
        --body: "Inter", "NotoSansKR", sans-serif;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--paper); }
      #root { position: relative; width: 1080px; height: 1920px; background: var(--paper); }

      .scene {
        position: absolute; inset: 0; background: var(--paper);
        background-image: radial-gradient(circle at 50% 45%, #fbf9f4 0, #f4f1ea 620px, #ebe6db 1100px);
      }
      /* Reels safe zone → content box y 360–1470, x 100–940 */
      .scene-content {
        width: 100%; height: 100%;
        padding: 360px 170px 450px 100px;
        display: flex; flex-direction: column; justify-content: center; align-items: flex-start;
        gap: 36px;
      }

      /* ---------- A. Hook ---------- */
      .h-xl { font-family: var(--display); font-size: 124px; line-height: 1.12; color: var(--ink); letter-spacing: -0.01em; }
      .mark { position: relative; display: inline-block; isolation: isolate; }
      .mark .bar {
        position: absolute; left: -10px; right: -10px; bottom: 6px; height: 46px;
        background: var(--red); opacity: 0.9; border-radius: 10px; z-index: -1; transform-origin: left center;
      }
      .mark .txt { position: relative; }
      .kicker { font-family: var(--body); font-weight: 900; font-size: 44px; color: var(--redText); letter-spacing: 0.04em; }

      /* ---------- B/C. The list ---------- */
      .head { position: relative; width: 100%; height: 170px; }
      .head > div { position: absolute; left: 0; bottom: 0; }
      .head-a { display: flex; align-items: baseline; gap: 26px; }
      .head-a .lbl { font-family: var(--display); font-size: 84px; color: var(--ink); }
      .head-a .cnt { font-family: "Inter", sans-serif; font-weight: 900; font-size: 150px; color: var(--redText); line-height: 1; font-variant-numeric: tabular-nums; }
      .head-a .unit { font-family: var(--display); font-size: 84px; color: var(--redText); }
      .head-b { font-family: var(--display); font-size: 96px; color: var(--ink); line-height: 1.1; }
      .head-b .mark .bar { height: 38px; bottom: 4px; }

      .list { width: 100%; display: flex; flex-direction: column; gap: 10px; }
      .row {
        display: flex; align-items: center; gap: 26px; height: 72px;
        font-family: var(--body); font-weight: 700; font-size: 48px; color: var(--ink);
      }
      .box { flex: none; width: 42px; height: 42px; border: 5px solid var(--ink); border-radius: 10px; background: var(--card); }
      .t { position: relative; white-space: nowrap; }
      .strike {
        position: absolute; left: -12px; right: -12px; top: 50%; height: 12px; margin-top: -6px;
        background: var(--red); border-radius: 6px; transform-origin: left center;
      }
      .row.more { color: var(--dim); font-weight: 900; }
      .row.more .box { border-style: dashed; border-color: var(--dim); }

      /* ---------- D. Three left ---------- */
      .h-lg { font-family: var(--display); font-size: 104px; line-height: 1.15; color: var(--ink); }
      .red { color: var(--redText); }
      .cards { width: 100%; display: flex; flex-direction: column; gap: 28px; margin-top: 20px; }
      .card {
        display: flex; align-items: center; gap: 34px; padding: 34px 40px; width: 100%;
        background: var(--card); border-radius: 36px; border: 4px solid var(--ink);
        box-shadow: 10px 10px 0 var(--ink);
      }
      .badge {
        flex: none; width: 96px; height: 96px; border-radius: 50%; background: var(--red);
        display: flex; align-items: center; justify-content: center;
        font-family: "Inter", sans-serif; font-weight: 900; font-size: 56px; color: #fff;
      }
      .card .ct { font-family: var(--body); font-weight: 900; font-size: 58px; color: var(--ink); }

      /* ---------- E. Bars ---------- */
      .bars { width: 100%; display: flex; flex-direction: column; gap: 64px; margin-top: 40px; }
      .bar-row { display: flex; flex-direction: column; gap: 18px; }
      .bar-top { display: flex; justify-content: space-between; align-items: baseline; width: 100%; }
      .bar-lbl { font-family: var(--body); font-weight: 900; font-size: 52px; color: var(--ink); }
      .bar-lbl.dim { color: var(--dim); }
      .bar-val { font-family: "Inter", sans-serif; font-weight: 900; font-size: 96px; line-height: 1; font-variant-numeric: tabular-nums; }
      .track { position: relative; width: 100%; height: 72px; border-radius: 36px; background: #e3ddd1; overflow: hidden; }
      .fill { position: absolute; left: 0; top: 0; bottom: 0; width: 100%; border-radius: 36px; transform-origin: left center; }
      .note { font-family: var(--body); font-weight: 700; font-size: 40px; color: var(--dim); margin-top: 10px; }

      /* ---------- F. Outro ---------- */
      .h-out { font-family: var(--display); font-size: 132px; line-height: 1.16; color: var(--ink); }
      .chip {
        display: flex; align-items: center; gap: 18px; margin-top: 40px;
        background: var(--ink); color: var(--paper); border-radius: 999px; padding: 22px 40px;
        font-family: var(--body); font-weight: 900; font-size: 42px;
      }
      .chip svg { width: 40px; height: 40px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="21" data-width="1080" data-height="1920">

      <!-- A. Hook 0–2.5 -->
      <section id="sA" class="clip scene" data-start="0" data-duration="2.8" data-track-index="1" data-track-kind="graphics" style="z-index:1">
        <div class="scene-content">
          <div id="a-kick" class="kicker">일 잘하는 사람의 습관</div>
          <div id="a-l1" class="h-xl">할 일이<br />많을수록</div>
          <div id="a-l2" class="h-xl"><span class="mark"><span id="a-bar" class="bar"></span><span class="txt">일은 안</span></span> 끝난다</div>
        </div>
      </section>

      <!-- B/C. List overflow + strike 2.5–10 -->
      <section id="sB" class="clip scene" data-start="2.5" data-duration="7.8" data-track-index="2" data-track-kind="graphics" style="z-index:2">
        <div class="scene-content" style="gap:28px">
          <div class="head">
            <div id="b-headA" class="head-a"><span class="lbl">오늘 할 일</span><span id="b-cnt" class="cnt">3</span><span class="unit">개</span></div>
            <div id="b-headB" class="head-b"><span class="mark"><span id="b-hbar" class="bar"></span><span class="txt">버릴 것</span></span>부터<br />정한다</div>
          </div>
          <div id="b-list" class="list">
            <div class="row" id="r1"><i class="box"></i><span class="t">메일 47통 답장<i class="strike" id="k1"></i></span></div>
            <div class="row" id="r2"><i class="box"></i><span class="t">주간 회의 자료<i class="strike" id="k2"></i></span></div>
            <div class="row keep" id="r3"><i class="box"></i><span class="t">핵심 보고서 마감</span></div>
            <div class="row" id="r4"><i class="box"></i><span class="t">슬랙 알림 확인<i class="strike" id="k4"></i></span></div>
            <div class="row keep" id="r5"><i class="box"></i><span class="t">고객 미팅 준비</span></div>
            <div class="row" id="r6"><i class="box"></i><span class="t">지난 회의록 정리<i class="strike" id="k6"></i></span></div>
            <div class="row keep" id="r7"><i class="box"></i><span class="t">팀원 1:1 면담</span></div>
            <div class="row" id="r8"><i class="box"></i><span class="t">엑셀 서식 다듬기<i class="strike" id="k8"></i></span></div>
            <div class="row" id="r9"><i class="box"></i><span class="t">보고서 표지 디자인<i class="strike" id="k9"></i></span></div>
            <div class="row more" id="r10"><i class="box"></i><span class="t">+ 14개 더…<i class="strike" id="k10"></i></span></div>
          </div>
        </div>
      </section>

      <!-- D. Three left 10–14 -->
      <section id="sD" class="clip scene" data-start="10" data-duration="4.3" data-track-index="1" data-track-kind="graphics" style="z-index:3">
        <div class="scene-content">
          <div id="d-title" class="h-lg">남은 <span class="red">3개</span>에만<br />집중</div>
          <div class="cards">
            <div class="card" id="d1"><div class="badge">1</div><div class="ct">핵심 보고서 마감</div></div>
            <div class="card" id="d2"><div class="badge">2</div><div class="ct">고객 미팅 준비</div></div>
            <div class="card" id="d3"><div class="badge">3</div><div class="ct">팀원 1:1 면담</div></div>
          </div>
        </div>
      </section>

      <!-- E. Bars 14–18 -->
      <section id="sE" class="clip scene" data-start="14" data-duration="4.3" data-track-index="2" data-track-kind="graphics" style="z-index:4">
        <div class="scene-content">
          <div id="e-title" class="h-lg">같은 시간,<br /><span class="red">8배</span> 집중</div>
          <div class="bars">
            <div class="bar-row" id="e-r1">
              <div class="bar-top"><span class="bar-lbl dim">23개로 나누면</span><span class="bar-val" style="color:#6f6a61"><span id="e-v1">0</span>%</span></div>
              <div class="track"><div id="e-f1" class="fill" style="background:#9a9386"></div></div>
            </div>
            <div class="bar-row" id="e-r2">
              <div class="bar-top"><span class="bar-lbl">3개로 나누면</span><span class="bar-val" style="color:#d93a28"><span id="e-v2">0</span>%</span></div>
              <div class="track"><div id="e-f2" class="fill" style="background:#ff4d3a"></div></div>
            </div>
          </div>
          <div id="e-note" class="note">하나에 쓰는 시간의 몫</div>
        </div>
      </section>

      <!-- F. Outro 18–21 -->
      <section id="sF" class="clip scene" data-start="18" data-duration="3" data-track-index="1" data-track-kind="graphics" style="z-index:5">
        <div class="scene-content">
          <div id="f-l1" class="h-out">오늘,</div>
          <div id="f-l2" class="h-out"><span class="mark"><span id="f-bar" class="bar" style="height:56px"></span><span class="txt">안 할 일</span></span>부터</div>
          <div id="f-l3" class="h-out">지워보세요</div>
          <div id="f-chip" class="chip">
            <svg viewBox="0 0 24 24"><path d="M6 3h12v18l-6-4.5L6 21z" fill="#f4f1ea"/></svg>
            저장해두고 내일 아침 다시 보기
          </div>
        </div>
      </section>

      <audio id="music" class="clip" data-start="0" data-duration="21" data-track-index="9" src="assets/soundtrack.wav" data-volume="1"></audio>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // ---------- A. Hook (line 1 visible at frame 0 = thumbnail) ----------
      tl.from("#a-l1", { scale: 1.18, transformOrigin: "left center", duration: 0.5, ease: "expo.out" }, 0);
      tl.from("#a-kick", { y: -30, opacity: 0, duration: 0.4, ease: "power2.out" }, 0.15);
      tl.from("#a-l2", { y: 80, opacity: 0, duration: 0.45, ease: "back.out(1.6)" }, 0.55);
      tl.fromTo("#a-bar", { scaleX: 0 }, { scaleX: 1, duration: 0.45, ease: "power3.inOut" }, 1.0);
      tl.fromTo("#a-l2", { x: 0 }, { x: 8, duration: 0.05, yoyo: true, repeat: 3, ease: "none" }, 1.0);

      // ---------- B. List piles up ----------
      tl.from("#sB", { opacity: 0, duration: 0.3, ease: "power1.out" }, 2.5);
      tl.from("#b-headA", { y: -40, opacity: 0, duration: 0.4, ease: "power3.out" }, 2.55);
      const rowTimes = [2.75, 3.05, 3.3, 3.52, 3.72, 3.9, 4.06, 4.2, 4.33, 4.5];
      rowTimes.forEach((t, i) => {
        tl.from(`#r${i + 1}`, { x: -60, opacity: 0, duration: 0.28, ease: i % 2 ? "back.out(2)" : "power3.out" }, t);
      });
      const counter = { v: 3 };
      const cntEl = document.getElementById("b-cnt");
      tl.to(counter, {
        v: 23, duration: 1.9, ease: "power1.in",
        onUpdate: () => { cntEl.textContent = Math.round(counter.v); },
      }, 2.75);
      tl.fromTo("#b-cnt", { scale: 1 }, { scale: 1.25, duration: 0.12, yoyo: true, repeat: 1, ease: "power2.out", transformOrigin: "left bottom" }, 4.62);
      // overload: the whole list trembles
      tl.fromTo("#b-list", { x: 0 }, { x: 6, duration: 0.06, yoyo: true, repeat: 9, ease: "none" }, 4.7);

      // ---------- C. Strike-through ----------
      tl.to("#b-headA", { y: -30, opacity: 0, duration: 0.3, ease: "power2.in" }, 5.9);
      tl.from("#b-headB", { y: 40, opacity: 0, duration: 0.4, ease: "expo.out" }, 6.05);
      tl.fromTo("#b-hbar", { scaleX: 0 }, { scaleX: 1, duration: 0.4, ease: "power3.inOut" }, 6.35);
      const strikes = [1, 2, 4, 6, 8, 9, 10];
      strikes.forEach((n, i) => {
        const t = 6.6 + i * 0.42;
        tl.fromTo(`#k${n}`, { scaleX: 0, rotation: -2 }, { scaleX: 1, rotation: -2, duration: 0.24, ease: "power2.out" }, t);
        tl.to(`#r${n}`, { opacity: 0.32, duration: 0.25, ease: "power1.out" }, t + 0.2);
      });
      // keepers light up
      ["#r3", "#r5", "#r7"].forEach((id, i) => {
        tl.to(`${id} .box`, { backgroundColor: "#ff4d3a", borderColor: "#ff4d3a", duration: 0.2, ease: "power2.out" }, 9.55 + i * 0.08);
        tl.to(id, { x: 20, duration: 0.3, ease: "back.out(2)" }, 9.55 + i * 0.08);
      });

      // ---------- D. Three left ----------
      tl.from("#sD", { opacity: 0, duration: 0.3, ease: "power1.out" }, 10);
      tl.from("#d-title", { y: 50, opacity: 0, duration: 0.45, ease: "expo.out" }, 10.1);
      tl.from(["#d1", "#d2", "#d3"], { x: 140, opacity: 0, duration: 0.45, ease: "back.out(1.5)", stagger: 0.18 }, 10.45);
      tl.from("#sD .badge", { scale: 0, duration: 0.35, ease: "back.out(3)", stagger: 0.18 }, 10.6);

      // ---------- E. Bars ----------
      tl.from("#sE", { opacity: 0, duration: 0.3, ease: "power1.out" }, 14);
      tl.from("#e-title", { scale: 0.85, opacity: 0, transformOrigin: "left center", duration: 0.45, ease: "expo.out" }, 14.1);
      tl.from(["#e-r1", "#e-r2"], { y: 40, opacity: 0, duration: 0.4, ease: "power3.out", stagger: 0.15 }, 14.4);
      tl.fromTo("#e-f1", { scaleX: 0 }, { scaleX: 0.13, duration: 0.6, ease: "power2.out" }, 14.8);
      tl.fromTo("#e-f2", { scaleX: 0 }, { scaleX: 1, duration: 1.1, ease: "expo.out" }, 15.3);
      const v1 = { v: 0 }, v2 = { v: 0 };
      const v1El = document.getElementById("e-v1"), v2El = document.getElementById("e-v2");
      tl.to(v1, { v: 4, duration: 0.6, ease: "power2.out", onUpdate: () => { v1El.textContent = Math.round(v1.v); } }, 14.8);
      tl.to(v2, { v: 33, duration: 1.1, ease: "expo.out", onUpdate: () => { v2El.textContent = Math.round(v2.v); } }, 15.3);
      tl.from("#e-note", { opacity: 0, duration: 0.4, ease: "power1.out" }, 16.3);

      // ---------- F. Outro ----------
      tl.from("#sF", { opacity: 0, duration: 0.3, ease: "power1.out" }, 18);
      tl.from("#f-l1", { y: 50, opacity: 0, duration: 0.4, ease: "power3.out" }, 18.1);
      tl.from("#f-l2", { y: 50, opacity: 0, duration: 0.4, ease: "back.out(1.6)" }, 18.3);
      tl.fromTo("#f-bar", { scaleX: 0 }, { scaleX: 1, duration: 0.45, ease: "power3.inOut" }, 18.65);
      tl.from("#f-l3", { y: 50, opacity: 0, duration: 0.4, ease: "expo.out" }, 18.6);
      tl.from("#f-chip", { y: 40, scale: 0.9, opacity: 0, duration: 0.45, ease: "back.out(2)" }, 18.85);

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
